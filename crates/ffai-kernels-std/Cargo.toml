[package]
name = "ffai-kernels-std"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FFAI Kernels kernel standard library — benchmark metadata and type definitions"
publish = true

build = "bin/build.rs"

[lints]
workspace = true

[features]
# Run the registered #[test_kernel] corpus on the CUDA backend
# (tests/cuda_kernel_corpus.rs). Forwards to the facade's cuda feature.
cuda = ["ffai-kernels/cuda"]
# Run the registered #[test_kernel] corpus on the HIP / ROCm backend
# (tests/hip_kernel_corpus.rs). Forwards to the facade's hip feature.
hip = ["ffai-kernels/hip"]
# Run the registered #[test_kernel] corpus on the Vulkan / SPIR-V backend
# (tests/vulkan_kernel_corpus.rs). Forwards to the facade's vulkan feature.
vulkan = ["ffai-kernels/vulkan"]

[[bin]]
name = "__ffai_runner"
path = "bin/runner.rs"

[dependencies]
ffai-kernels.workspace = true
half.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
# AURA MSL snapshot tests (tests/aura_msl_snapshots.rs).
insta.workspace = true
bytemuck.workspace = true
