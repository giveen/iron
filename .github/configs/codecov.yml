coverage:
  precision: 1
  round: down
  status:
    project:
      default:
        # Workspace floor — never regress, target lifts as new tests land.
        target: auto
        threshold: 0.5%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 1%
        if_ci_failed: success
        # PR patch gates on CORE-logic flags only. wh-iron-std's kernel
        # HOST/dispatch code is coverable only on a GPU, and that run
        # (coverage-kernels) is NON-PR — so a std-only PR has no fresh std
        # upload and must NOT fail patch on carried-forward lines. std is
        # instead protected by its project ratchet (below), enforced on main.
        flags:
          - codegen
          - core
          - macros
          - runtime
          - cli

# Per-crate gates. Each crate ratchets against its own current % via
# `target: auto`, so coverage can only go up. Aspirational floors stay
# documented in CONTRIBUTING.md `Test coverage` section but aren't
# enforced as numeric targets here — that just produced noisy red checks
# while crates were still ramping. The ratchet is the real teeth: any
# PR that drops a crate's coverage by more than `threshold: 0.5%` fails
# its flag check.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: codegen
      paths:
        - crates/wh-iron-codegen/
      statuses:
        - type: project
          target: auto
          threshold: 0.5%
          if_ci_failed: success
    - name: core
      paths:
        - crates/wh-iron-core/
      statuses:
        - type: project
          target: auto
          threshold: 0.5%
          if_ci_failed: success
    - name: macros
      paths:
        - crates/wh-iron-macros/
      statuses:
        - type: project
          target: auto
          threshold: 0.5%
          if_ci_failed: success
    - name: runtime
      paths:
        - crates/wh-iron-runtime/
      statuses:
        - type: project
          target: auto
          threshold: 0.5%
          if_ci_failed: success
    - name: cli
      paths:
        - crates/wh-iron-cli/
      statuses:
        - type: project
          target: auto
          threshold: 0.5%
          if_ci_failed: success
    # wh-iron-std MINUS the `#[kernel]` DSL bodies (excluded globally in
    # `ignore:` below — the proc-macro consumes them, so they never execute
    # as Rust). This flag is the kernel HOST / dispatch / registry code, the
    # coverable half of the "kernels" the >= 80% goal refers to. It is measured
    # only by ci.yml's `coverage-kernels` job (macOS + GPU, NON-PR), so on PRs
    # it carries forward from main; this project ratchet is what enforces it.
    - name: std
      paths:
        - crates/wh-iron-std/
      statuses:
        - type: project
          target: auto
          threshold: 0.5%
          if_ci_failed: success

# Files excluded from the line-coverage denominator:
#   - facade re-exports (no logic)
#   - kernel-body files (`#[kernel]` proc-macro consumes the body; the Rust
#     body never executes, so line coverage is meaningless — correctness is
#     validated end-to-end via `iron bench` numerical-equiv vs MLX)
#   - tests, benches, build scripts
ignore:
  - "crates/wh-iron/src/lib.rs"
  - "crates/wh-iron/src/prelude.rs"
  - "crates/wh-iron-std/src/kernels/**"
  - "**/tests/**"
  - "**/benches/**"
  - "**/build.rs"
  - "target/**"

comment:
  layout: "header, flags, files, footer"
  require_changes: true
  show_carryforward_flags: true

github_checks:
  annotations: true
