name: Release

# Reusable. Builds the release binary and publishes the GitHub Release.
#
# The tag trigger lives in ci.yml, not here: on a `v*` tag push ci.yml runs
# lint + build + test + correctness and only THEN calls this workflow, so a
# release can never publish from a red commit. `workflow_dispatch` stays for
# re-publishing an existing tag by hand (ungated, intentional).
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release (e.g. v0.2.0).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.2.0).
        required: true

permissions:
  contents: write # create/update GitHub Releases and upload assets

jobs:
  publish:
    name: Build + publish iron binary
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v5.0.0
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false # release builds are rare; don't pollute the cache

      - name: Build release binary
        run: cargo build --release -p wh-iron-cli

      - name: Package binary
        run: |
          cp target/release/iron iron
          tar czf iron-aarch64-apple-darwin.tar.gz iron
          cp scripts/install.sh install.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"

          # Idempotent: create, or upload assets to an existing release.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            iron-aarch64-apple-darwin.tar.gz \
            install.sh \
            || gh release upload "$TAG" \
                 iron-aarch64-apple-darwin.tar.gz \
                 install.sh \
                 --clobber
